  ep33: "NSA 조작 | QPU 출력 전송 경로 역추적→NSA 파이프라인 발견(QPU→벤회사→NSA). YM 이니셜 패킷 헤더. 데이터 바꿔치기 아이디어 구체화. 문서화."
  ep34: "규정 준수 시연 | 모레노 알고리즘 첫 실제 작동(강제 실행). 모레노 손 떨림+눈 감음. 학생 보호 위한 유일한 양보."
  ep35: "FBI 압박 | 소피아 면책권 제안(모레노 증언 조건). 모레노 심정지→ICU 이송(생존). LST 혜진 재협박. 이중 충격. [모레노 실제 사망: ep37]"
