  ep37: "양자 쇼다운 1부 | Sub-48 QPU 시운전 개시. Carlos 자리 비어있음. 마르셀로 진입 통제. 첫 RSA 키 복구 시도. 모레노 사망 확인(2043-03-27T19:38:44Z, 심근경색). Chase Bank 작전 실행."
  ep38: "양자 쇼다운 2부 | RSA 키 복구+군사 통신 해독 현실화. 2:2 교착(CIA vs 카르텔)에서 수민 캐스팅보트. '손이 움직였다. 수술인지 살인인지 모르겠다.' 철학적 아크 완성."
  ep39: "사후처리 | RSA 붕괴 여파 전 세계 확산(금융/군사/통신). 모든 세력 수민 확보/제거 시도. Deadman 47분 위기 경험."
  ep40: "FBI 마무리 | 소피아 보호구금. 외부 연락 차단. 3자 화상협상(CIA/카르텔/수민)—이선 CIA 2키 공개. '어느 한 조직이 끊어도 나머지 둘이 막는 구조' 공학적 설계. FBI 법적 절차로 배제. 소피아 마지막 전화: 다른 삶 제안→수민 거절. 요나스 CIA 신분 부분 노출."
  ep41: "에필로그(Q+80일) | NSA-벤 연결 뉴스 폭로(CIA 설계). 벤 SEC 조사+법정 소환. 72시간 재인증 가동(CIA+카르텔+수민). Jonas CIA 8년 잠입 고백→수민 캐스팅보트 완전 자각. '벨라는 잘 있다'. 자유 없음, 권력 있음. 찝찝한 공존."

