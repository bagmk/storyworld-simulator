  ep27: "선 | Failsafe 합의 직후 NSA 협박 신호 콘솔 출현. 시스템이 이미 다른 힘에 관찰됨. Elena→수민 독대: '12년 전 여동생 사라진 날 세상이 끝났다고 생각했는데, 세상은 안 끝나더라. 내가 끝난 거지.'"
  ep28: "배신과 Elena 죽음 | 요나스 Elena 처형(카르텔 처형팀 대기 상황에서 직접 처리). Elena CIA 인식→'벨라 찾아줘?'→고개 끄덕임→눈 감음. key_4 CIA 회수. 수민 4분 뒤 도착, 역추산으로 재구성."
  ep29: "충성 전환 | FBI/CIA/NSA 무능+위선 노출→수민 카르텔 쪽 기움. BURKE-7 채널 평문 노출(암호화 오류)→요나스-CIA 교신 단편 포착, 이중첩자 확신 못함. Ben 모레노 소식 없음 재연락."
