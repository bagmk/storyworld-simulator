episode:
  id: ep01_conference_shadow
  date: 2041-05-21T10:00
  location: International conference venue — main auditorium, corridor, sponsor lounge
  summary: >-
    제네바 컨퍼런스 센터에서 모레노 교수의 초전도 큐비트 발표가 열린다.
    수민은 발표를 들으며 자신의 보상 회로 아이디어가 단순한 발상이 아니라
    실제 시스템 수준에서 의미를 가질 수 있다는 가능성을 처음으로 강하게 체감한다.
    발표장 안에는 이 연구를 학문적 성과가 아니라 전략적 가치로 보는 듯한 시선이 있다.
    쉬는 시간, 모레노는 수민에게 그 아이디어를 아직 붙들고 있는지 직접 묻고,
    이를 현실화하려면 연구실 수준을 넘어서는 자원과 환경이 필요하다고 짚는다.
    이후 스폰서 라운지에서 Miller라는 남성이 접근해
    공식 프로그램 바깥의 더 빠른 지원 경로가 있을 수 있음을 시사한다.
    이 만남을 통해 수민은 누군가가 이미 자신의 연구 가치를 이해하고 있으며,
    그것을 현실로 만들 자원과 조건을 쥐고 있다는 사실을 깨닫는다.

  phases:
    - id: presentation
      location: main_auditorium
      description: Moreno's talk is in progress. Sumin is in the audience.

    - id: break_corridor
      location: corridor
      description: The talk pauses or ends for a break. Conversation moves into the corridor.

    - id: sponsor_lounge
      location: sponsor_lounge
      description: Post-presentation informal contact space where private approaches can happen.

  introduced_clues:
    - id: clue_ep01_academic_presentation_c01
      allowed_phase: presentation
      content: |-
        국제 학회의 모레노 교수의 첫 슬라이드는 《Quantum Coherence Scaling: T₂ → T₂ × 3.7》이다.
        수민의 박사과정중 지도교수였던 모레노 교수의 발표에 경청한다.
        그는 핵심 병목을 제시한다.
        "기존 제어 알고리즘의 한계는 속도가 아니라 예측 구조에 있습니다."
      state_delta:
        - Sumin realizes her compensation-loop idea may matter at full-system scale
        - The talk frames real-time control as the core bottleneck
      trigger: Moreno discusses coherence scaling, drift compensation, or real-time control
      inject_threshold: 0.30
      inject_method: system_alert

    - id: clue_ep01_academic_presentation_c02
      allowed_phase: presentation
      content: |-
        발표장 앞줄 오른쪽의 서너 명은 일반 학회 청중처럼 보이지 않는다.
        박수나 반응은 거의 없고, 양자컴퓨터의  구현 조건에서만 동시에 반응한다.
      state_delta:
        - Sumin notices observers with non-academic interest
        - The room contains people evaluating implementation value
      trigger: Sumin scans the audience or attention shifts from the speaker to the room
      inject_threshold: 0.38
      inject_method: environmental_cue

    - id: clue_ep01_academic_presentation_c03
      allowed_phase: break_corridor
      content: |-
        쉬는 시간 복도에서 모레노가 자신의 제자 수민에게 먼저 말을 건다.
        그는 예전의 보상 회로 아이디어를 아직 붙들고 있는지 묻고,
        현재 실험 환경과 그 아이디어를 어디까지 밀고 갈 생각인지 확인한다.
      state_delta:
        - Moreno directly reopens Sumin's earlier idea in private
        - The conversation shifts from public talk to Sumin's own technical path
      trigger: Moreno speaks privately to Sumin after the talk
      inject_threshold: 0.52
      inject_method: npc_question

    - id: clue_ep01_academic_presentation_c04
      allowed_phase: break_corridor
      content: |-
        모레노는 그 문제가 연구실 안에서 혼자 오래 끌 수 있는 종류가 아니라고 말한다.
        실시간 구현에는 예측 제어, 장시간 안정화, 반복 검증, 폐쇄형 테스트 환경이 필요하다고 짚는다.
        핵심은 이론만이 아니라 자원과 환경이라고 정리한다.
      state_delta:
        - Moreno reframes the idea as an infrastructure problem
        - Sumin sees that external support may be structurally necessary
      trigger: the conversation turns to implementation requirements, resources, or support
      inject_threshold: 0.68
      inject_method: npc_question

    - id: clue_ep01_academic_presentation_c05
      allowed_phase: sponsor_lounge
      content: |-
        발표 후 스폰서 라운지에서 Miller가 수민에게 접근한다.
        그는 발표 감상 대신 실험 환경, 병목 구간, 통제권 범위를 묻는다.
        마지막에 공식 과제는 느리며 다른 지원 경로도 있을 수 있다고 말하고,
        'D. Miller'라고 적힌 카드만 남긴 채 떠난다.
      state_delta:
        - A new actor appears who cares about control, access, and speed rather than academic discussion
        - Support is reframed as a potentially unofficial path
      trigger: Miller approaches Sumin in a semi-private post-talk setting
      inject_threshold: 0.84
      inject_method: npc_offer

  resolved: []
  recommended_length: 3200
  pacing: tense
  max_turns: 28