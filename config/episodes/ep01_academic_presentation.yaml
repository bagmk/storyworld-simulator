episode:
  id: ep01_conference_shadow
  date: 2041-05-21T10:00
  location: International conference venue — main auditorium, sponsor lounge, corridors
  summary: >
    제네바 컨퍼런스 센터에서 모레노 교수의 초전도 큐비트 발표가 열린다. 수민은 발표를 들으며
    단순한 성능 향상을 넘어, 자신의 보상 회로 아이디어가 실제 시스템 수준에서 통할 수 있다는 가능성을 처음으로 실감한다.
    발표장 곳곳에는 이 연구를 단순한 학문적 성과가 아니라 전략 자산으로 평가하는 듯한 인물들이 보인다.
    쉬는 시간, 모레노는 수민에게 이 아이디어를 혼자 붙들고 있어서는 안 된다고 말하며,
    실시간 제어와 예측 보정을 구현하려면 연구실 수준을 넘어서는 자원이 필요하다고 압박하듯 조언한다.
    이후 Miller라는 남성이 조용히 접근해, 공식 프로그램과는 다른 형태의 연구 지원 가능성을 시사한다.
    이 만남은 수민에게 감시의 공포보다 더 큰 사실을 남긴다.
    누군가는 이미 자신의 연구 가치를 이해하고 있고, 그것을 현실로 만들 자원을 쥐고 있다는 점이다.

  introduced_clues:
    - id: clue_ep01_academic_presentation_c01
      content: |
        모레노 교수의 첫 슬라이드 제목: 《Quantum Coherence Scaling: T₂ → T₂ × 3.7》
        이후 슬라이드에서 그가 설명한 병목들: 위상 드리프트(phase drift), 실시간 보상(real-time compensation), 온도 변화에 따른 편차(thermal variance correction).
        발표 중간, 모레노가 말했다. "기존 제어 알고리즘의 한계는 속도가 아니라 예측 구조에 있습니다."
      trigger: Moreno mentions coherence scaling, drift compensation, or real-time control in the presentation; or Sumin reacts to a slide or number on screen
      inject_threshold: 0.30
      inject_method: system_alert

    - id: clue_ep01_academic_presentation_c02
      content: |
        발표장 앞줄 오른쪽. 서너 명이 앉아있었다. 박수도, 메모도 없었다.
        기술 슬라이드가 나올 때만 자세가 바뀌었다. 특히 구현 조건 슬라이드—보정 주기(correction cycle), drift window, control latency—에서 동시에 화면을 향했다.
        그 중 한 명은 슬라이드가 넘어갈 때마다 옆 사람에게 짧게 무언가를 말했다. 마이크가 없어 들리지 않았다.
      trigger: Sumin notices audience members who are not typical academics; or any agent scans the room or comments on the audience; or Miller, Moreno, or an unnamed observer is described watching the screen
      inject_threshold: 0.38
      inject_method: environmental_cue

    - id: clue_ep01_academic_presentation_c03
      content: |
        쉬는 시간 직전, 옆자리 남자의 메모장이 잠깐 보였다.
        COHERENCE.
        DRIFT.
        COMPENSATION LAYER?
        그 아래 동그라미 친 문장: "real-time viable if externally supported"
        메모장 상단 모서리에는 'AMRD-7'이라는 인쇄된 글자가 있었다. 대학원생 노트가 아니었다.
      trigger: any agent moves or writes during a slide; or Miller is seen making notes; or a physical object (notebook, badge, phone) appears in scene
      inject_threshold: 0.46
      inject_method: document_artifact

    - id: clue_ep01_academic_presentation_c04
      content: |
        쉬는 시간, 복도에서 모레노가 수민에게 먼저 말을 걸었다.
        "네가 예전에 했던 보상 회로 발상, 아직 붙들고 있지?"
        안부 없이 바로 물었다. 수민의 실험 환경이 있는지, 제어 루프를 직접 돌릴 수 있는지.
        그리고 낮게 덧붙였다. "그건 혼자 오래 끌 수 있는 종류의 문제가 아니야."
      trigger: Moreno speaks directly to Sumin about her research, resources, or next steps; or any NPC asks about Sumin's experimental setup or progress
      inject_threshold: 0.52
      inject_method: npc_question

    - id: clue_ep01_academic_presentation_c05
      content: |
        모레노가 발표장 안쪽을 한 번 돌아보고 말했다.
        "실시간 보정은 논문으로는 설명돼도, 실제로 굴리려면 다른 종류의 지원이 필요해."
        구체적으로 열거했다. 온도 변화 예측 제어, 장시간 안정화, 반복 검증, 폐쇄형 테스트 환경.
        "그런 건 누군가가 의지를 갖고 밀어줘야만 가능하다."
      trigger: Moreno mentions support, funding, resources, or external collaboration; or the conversation moves to what Sumin would need to make her idea real
      inject_threshold: 0.58
      inject_method: npc_question

    - id: clue_ep01_academic_presentation_c06
      content: |
        발표 후 스폰서 라운지. 한 남자가 수민에게 다가왔다. 명함은 꺼내지 않았다.
        발표 감상도 없었다. 대신 수민의 현재 실험 환경, 병목 구간, 실험 체계의 어느 부분까지 직접 통제하고 싶은지를 물었다.
        마지막에 말했다. "공식 과제는 느리죠. 더 민첩한 지원 구조를 찾는 사람들도 있습니다."
        그가 자리를 뜨면서 작은 카드를 테이블에 남겼다. 이름: 'D. Miller'. 소속란은 비어있었다.
      trigger: Miller speaks to Sumin directly; or any unnamed man approaches Sumin after the presentation; or Miller asks about her research environment or constraints
      inject_threshold: 0.64
      inject_method: npc_offer

  resolved: []
  recommended_length: 3200
  pacing: tense
  max_turns: 28
